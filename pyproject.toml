[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "videditor"
version = "0.1.0"
description = "Logiciel de montage vidéo (R5.A.05 / R5.A.06)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "av>=12",
    "numpy>=1.26",
    # headless : la version classique d'OpenCV embarque son propre Qt
    # et entre en conflit avec PySide6 sous Linux
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
audio = ["audiomentations", "soundfile", "sounddevice"]
dev = ["pytest", "pytest-qt", "ruff"]

[project.scripts]
videditor = "videditor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
